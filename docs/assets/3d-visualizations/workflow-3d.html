<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n 3D Workflow Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }
        #canvas-container { 
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 10;
        }
        h2 { margin-bottom: 10px; color: #00d9ff; }
        p { margin: 5px 0; line-height: 1.6; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="info">
    <h2>n8n 3D Workflow</h2>
    <p>Interactive visualization of workflow nodes and connections.</p>
    <p><strong>Controls:</strong></p>
    <p>🖱 Drag to rotate<br>🔄 Scroll to zoom</p>
</div>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0f0f);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 30);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x00d9ff, 1);
    pointLight.position.set(20, 20, 20);
    scene.add(pointLight);
    
    const workflowNodes = [
        { id: 1, name: 'Trigger', pos: [-15, 0, 0], color: 0x00ff00 },
        { id: 2, name: 'API Call', pos: [0, 10, 0], color: 0x0099ff },
        { id: 3, name: 'Transform', pos: [0, -10, 0], color: 0x0099ff },
        { id: 4, name: 'Send Email', pos: [15, 5, 0], color: 0xff6600 },
        { id: 5, name: 'Log Result', pos: [15, -5, 0], color: 0xff6600 },
    ];
    
    const connections = [
        { from: 1, to: 2 },
        { from: 1, to: 3 },
        { from: 2, to: 4 },
        { from: 3, to: 5 },
    ];
    
    const nodes = {};
    
    workflowNodes.forEach(nodeData => {
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ 
            color: nodeData.color,
            metalness: 0.3,
            roughness: 0.4,
            emissive: nodeData.color,
            emissiveIntensity: 0.2
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...nodeData.pos);
        scene.add(mesh);
        
        nodes[nodeData.id] = { mesh, data: nodeData };
    });
    
    connections.forEach(conn => {
        const start = nodes[conn.from].mesh.position;
        const end = nodes[conn.to].mesh.position;
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(
            new Float32Array([start.x, start.y, start.z, end.x, end.y, end.z]),
            3
        ));
        
        const material = new THREE.LineBasicMaterial({ color: 0x00d9ff, linewidth: 2 });
        const line = new THREE.Line(geometry, material);
        scene.add(line);
    });
    
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    
    document.addEventListener('mousedown', () => { isDragging = true; });
    document.addEventListener('mouseup', () => { isDragging = false; });
    
    document.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            scene.rotation.y += deltaX * 0.01;
            scene.rotation.x += deltaY * 0.01;
        }
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });
    
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        camera.position.z += e.deltaY * 0.05;
        camera.position.z = Math.max(10, Math.min(100, camera.position.z));
    });
    
    function animate() {
        requestAnimationFrame(animate);
        Object.values(nodes).forEach(node => {
            const time = Date.now() * 0.001;
            node.mesh.position.y += Math.sin(time + node.data.id) * 0.0005;
        });
        renderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
